name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: swift test
      - run: python3 -m unittest discover -s Tests -p 'test_*.py'
      - run: python3 scripts/generate_tokens.py --check
      - run: python3 scripts/generate_localizations.py --check
      - run: python3 scripts/build_app.py --portable
